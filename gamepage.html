<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Bounce - Jugamos</title>
  <style>
    body {
      text-align: center;
      background: linear-gradient(135deg, #0f9b0f, #000);
      color: white;
      font-family: "Trebuchet MS", sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 20px;
      font-size: 2em;
      text-shadow: 2px 2px 4px #000;
    }

    canvas {
      background: #005f20;
      display: block;
      margin: 20px auto;
      border: 4px solid white;
      border-radius: 10px;
    }

    p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>⚽ Football Bounce ⚽</h1>
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <p>Player: <span id="playerScore">0</span> | AI: <span id="aiScore">0</span></p>
  <p>Use <strong>W</strong> (Up) and <strong>S</strong> (Down) to move.</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const player = { x: 20, y: canvas.height / 2 - 40, width: 15, height: 80, dy: 0 };
    const ai = { x: canvas.width - 35, y: canvas.height / 2 - 40, width: 15, height: 80, speed: 3 };
    const ball = { x: canvas.width / 2, y: canvas.height / 2, size: 15, dx: 4, dy: 3 };

    let playerScore = 0;
    let aiScore = 0;

    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawBall(x, y, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawNet() {
      ctx.fillStyle = "white";
      for (let i = 0; i < canvas.height; i += 30) {
        ctx.fillRect(canvas.width / 2 - 1, i, 2, 15);
      }
    }

    function movePlayer() {
      player.y += player.dy;
      if (player.y < 0) player.y = 0;
      if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
    }

    function moveAI() {
      const aiCenter = ai.y + ai.height / 2;
      if (aiCenter < ball.y - 10) ai.y += ai.speed;
      else if (aiCenter > ball.y + 10) ai.y -= ai.speed;

      if (ai.y < 0) ai.y = 0;
      if (ai.y + ai.height > canvas.height) ai.y = canvas.height - ai.height;
    }

    function moveBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Bounce top & bottom
      if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
        ball.dy *= -1;
      }

      // Player collision
      if (
        ball.x - ball.size < player.x + player.width &&
        ball.y > player.y &&
        ball.y < player.y + player.height
      ) {
        ball.dx *= -1;
        ball.x = player.x + player.width + ball.size;
      }

      // AI collision
      if (
        ball.x + ball.size > ai.x &&
        ball.y > ai.y &&
        ball.y < ai.y + ai.height
      ) {
        ball.dx *= -1;
        ball.x = ai.x - ball.size;
      }

      // Score
      if (ball.x < 0) {
        aiScore++;
        resetBall();
      }
      if (ball.x > canvas.width) {
        playerScore++;
        resetBall();
      }

      document.getElementById("playerScore").textContent = playerScore;
      document.getElementById("aiScore").textContent = aiScore;

      // End game
      if (playerScore >= 5 || aiScore >= 5) {
        alert((playerScore > aiScore ? "You Win! 🎉" : "AI Wins 😢") + " Refresh to play again!");
        resetGame();
      }
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx *= -1;
      ball.dy = 3 * (Math.random() > 0.5 ? 1 : -1);
    }

    function resetGame() {
      playerScore = 0;
      aiScore = 0;
      resetBall();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawNet();
      drawRect(player.x, player.y, player.width, player.height, "white");
      drawRect(ai.x, ai.y, ai.width, ai.height, "white");
      drawBall(ball.x, ball.y, ball.size, "yellow");
    }

    function update() {
      movePlayer();
      moveAI();
      moveBall();
      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "w") player.dy = -6;
      if (e.key === "s") player.dy = 6;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "s") player.dy = 0;
    });

    update();
  </script>
</body>
</html>
